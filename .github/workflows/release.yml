name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag name override for manual packaging runs
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-and-release:
    name: package and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.5"
      - name: Verify unit tests and vet
        run: |
          set -eu
          go vet ./...
          env -u AGT_INTEGRATION -u AGT_DATABASE_URL -u AGT_IMAGE_PYTHON -u AGT_IMAGE_GO -u AGT_IMAGE_NODE -u AGT_IMAGE_RUST -u AGT_SANDBOX_IMAGE go test -race ./...
      - name: Build release archives
        run: |
          set -eu
          sh scripts/package.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/agt_*.tar.gz
            dist/agt_*.zip
            dist/SHA256SUMS
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agt_*.tar.gz
            dist/agt_*.zip
            dist/SHA256SUMS
            dist/BUILD.txt
